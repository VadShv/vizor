services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vizor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
  app:
    build: .
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/vizor
      JWT_SECRET: ${JWT_SECRET:-vizor-dev-secret}
      PORT: 3003
      CORS_ORIGIN: "*"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3003:3003"
    restart: unless-stopped
volumes:
  pgdata:
